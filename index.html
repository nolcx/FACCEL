<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FACCEL - Herramienta para procesar facturas electrónicas de Hacienda" />
    <title>FACCEL | Procesamiento de Facturas Electrónicas</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Toastify Styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.css"
    />
    <!-- Custom styles -->
    <script type="module" crossorigin src="/FACCEL/assets/index-TC_3Vev9.js"></script>
    <link rel="stylesheet" crossorigin href="/FACCEL/assets/index-BIDMTKqh.css">
  </head>
  <body>
    <div class="main-container">
      <h1>Procesamiento de Facturas Electrónicas</h1>

      <label for="formFile">Cargar Archivos XML</label>

      <!-- Files Input -->
      <input
        class="form-control xml_input_form"
        type="file"
        id="formFile"
        multiple
      />

      <!-- Tool Kit -->
      <div class="toolkit-container">
        <!-- Button of report generation -->
        <button type="button" class="btn btn-success export-button" data-icon="download">
          Generar Reporte
        </button>

        <!-- Dropdown selector of filters -->
        <div class="btn-group">
          <button
            type="button"
            class="btn btn-primary dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            data-icon="filter"
          >
            Filtrar por
          </button>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item filter-date-option" href="#" data-icon="calendar">
                Por Fecha de Emisión
              </a>
            </li>
            <li>
              <a class="dropdown-item filter-between-date-option" href="#" data-icon="calendar">
                Por Rango de Fechas
              </a>
            </li>
            <li>
              <a class="dropdown-item filter-receptor-option" href="#" data-icon="user">
                Por Receptor
              </a>
            </li>
            <li>
              <a class="dropdown-item filter-provider-option" href="#" data-icon="user">
                Por Proveedor
              </a>
            </li>
          </ul>
        </div>

        <!-- Button to select all the bills -->
        <button
          type="button"
          class="btn btn-secondary bills-select-all-button"
          data-icon="checkSquare"
        >
          Seleccionar Todos
        </button>

        <!-- Button clean selections -->
        <button
          type="button"
          class="btn btn-secondary bills-clear-selection-button"
          data-icon="square"
        >
          Deseleccionar Todos
        </button>
      </div>

      <!-- Selected Filters Bubble List -->
      <h2 class="header-filter-list d-none">Filtros Activos</h2>
      <div class="filter-bubble-list"></div>

      <!-- Bills Container -->
      <h2 class="header-list-bills d-none">Facturas Cargadas</h2>
      <div class="bills-container"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
