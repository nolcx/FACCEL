<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FACCEL</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./src/assets/style.css" />
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="main-container">
      <h1>¡Bienvenid@ a FACCEL! 👋</h1>

      <label for="formFile" class="form-label"
        >Adjunte aquí los archivos XML a procesar.</label
      >

      <!-- Files Input -->
      <input
        class="form-control xml_input_form w-25"
        type="file"
        id="formFile"
      />

      <!-- Tool Kit -->
      <div class="toolkit-container">
        <button type="button" class="btn btn-success mt-2 export-button">
          Generar Reporte
        </button>

        <!-- Boton selector de filtros -->
        <div class="btn-group mt-2">
          <button
            type="button"
            class="btn btn-secondary dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Filtrar por:
          </button>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item filter-date-option" href="#"
                >Fecha Emisión</a
              >
            </li>
            <li>
              <a class="dropdown-item filter-between-date-option" href="#"
                >Entre Fechas</a
              >
            </li>
            <li>
              <a class="dropdown-item filter-receptor-option" href="#"
                >Receptor</a
              >
            </li>
            <li>
              <a class="dropdown-item filter-provider-option" href="#"
                >Proveedor</a
              >
            </li>
          </ul>
        </div>
      </div>

      <!-- Selected Filters Bubble List -->
      <div class="d-flex flex-wrap mt-2 filter-bubble-list"></div>

      <!-- Bills Container -->
      <div class="bills-container"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
